# ============================================================
#  12 PUBS OF CHRISTMAS  ~*~  the only file you need to edit
# ============================================================
#  Stops appear on the site in the order listed here.
#  Only `name` and `rule` are required. Everything else is optional:
#    section : a heading shown when it changes ("East Village", "Brooklyn")
#    address : used for the "Google Maps" / "directions" links
#    lat/lng : puts a pin on the map + works out walking times
#              (right-click a spot in Google Maps to copy them)
#    travel  : how you get TO this stop: walk (default) or train
#    type    : set to "train" for a stop that isn't a pub (draws it as a subway stop)
#    time    : fixed arrival time. If left out, the site estimates one from
#              event.start_time + minutes_per_pub + travel time.
#    emoji   : shown next to the name
#    notes   : any extra info
#
#  Coordinates below are approximate (good enough for the map).
# ============================================================

event:
  title: "Fantastical 12 Pubs of 2026"
  tagline: "12 pubs, 12 pints, 12 rules"
  header_image: "header.jpg"   # photo shown in the header (put the file next to index.html). Delete to hide.
  year: 2026
  date: "2026-12-05"          # YYYY-MM-DD, drives the countdown
  start_time: "4:00 PM"       # drives the countdown + estimated arrival times
  done_unlocks_at: "2026-12-05T15:00:00-05:00"   # DONE buttons are locked until this time (NY time). Delete the line to switch the lock off.
  minutes_per_pub: 30         # 30 minutes max in each pub!
  train_minutes: 20           # time allowed for the L train ride
  meet_at: "Lucky, 168 Avenue B"
  checkins: true              # location check-ins when you tick DONE (needs the Netlify functions deployed)
  verify_radius_m: 150        # how close (metres) to a pub counts as "verified"
  leaderboard: true           # public live leaderboard (names + pub counts only)
  dress_code: "Christmas jumpers MANDATORY 🎅"
  penalty: "Break a rule = FINISH YOUR DRINK or DO A SHOT"
  donation:                   # delete this block to hide the donation box
    name: "Ionad Hind Rajab"
    url: "https://www.ionadhindrajab.org/donate"
    blurb: "We're raising money for Ionad Hind Rajab, a centre in Mawasi, Khan Younis supporting displaced children in Gaza with food, clean water, education, play and psychosocial support."
    button: "DONATE NOW"
  host: "Your Name Here"
  contact: "text the group chat"
  night_rules:
    - "Christmas jumpers mandatory 🎅"
    - "30 minutes max in each pub. No dawdling."
    - "If a ping pong ball ends up in your drink, you must finish the rest of your drink. The ball is then yours to drop into someone else's cup 😈"

